{% extends 'admin/index.html' %}
{% block content %}

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="gallery-container">
    <div class="page-header">
        <h1>
            <i class="fas fa-user-graduate"></i>
            Student Management
        </h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openCreateModal()">
                <i class="fas fa-user-plus"></i>
                Add Student
            </button>
        </div>
    </div>

    <div class="gallery-filters">
        <div class="filter-group">
            <label class="filter-label" for="statusFilter">Approval:</label>
            <select id="statusFilter" class="filter-select" onchange="filterTable()">
                <option value="">All Applications</option>
                <option value="1">Approved</option>
                <option value="0">Pending</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table id="studentTable" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Photo</th>
                    <th>Student Info</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Joined</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data loaded via AJAX -->
            </tbody>
        </table>
    </div>
</div>

<!-- Application/Student Modal (Create & Edit) -->
<div class="modal fade" id="studentModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document"> <!-- modal-lg for wider form -->
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Student</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="studentForm" onsubmit="handleFormSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" id="studentId" name="student_id_pk">
                    {% csrf_token %}

                    <!-- Nav tabs -->
                    <ul class="nav nav-tabs" id="studentTab" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="personal-tab" data-toggle="tab" href="#personal"
                                role="tab">Personal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="address-tab" data-toggle="tab" href="#address"
                                role="tab">Address</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="academic-tab" data-toggle="tab" href="#academic"
                                role="tab">Academic</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="financial-tab" data-toggle="tab" href="#financial"
                                role="tab">Financial</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="references-tab" data-toggle="tab" href="#references"
                                role="tab">References</a>
                        </li>
                    </ul>

                    <!-- Tab panes -->
                    <div class="tab-content mt-3">
                        <!-- Personal Tab -->
                        <div class="tab-pane fade show active" id="personal" role="tabpanel">
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>First Name*</label>
                                    <input type="text" class="form-control" name="first_name" required>
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Middle Name</label>
                                    <input type="text" class="form-control" name="middle_name">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Last Name</label>
                                    <input type="text" class="form-control" name="last_name">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Email*</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Student ID (Custom)</label>
                                    <input type="text" class="form-control" name="student_id">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>Gender</label>
                                    <select class="form-control" name="gender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>DOB</label>
                                    <input type="date" class="form-control" name="date_of_birth">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Phone</label>
                                    <input type="text" class="form-control" name="phone_number">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Marital Status</label>
                                    <select class="form-control" name="mrital_status">
                                        <option value="">Select</option>
                                        <option value="Single">Single</option>
                                        <option value="Married">Married</option>
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Spouse Name</label>
                                    <input type="text" class="form-control" name="spouse_name">
                                </div>
                            </div>
                            <!-- Status Toggles -->
                            <div class="row mt-2">
                                <div class="col-md-6">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="statusSwitch"
                                            name="status" value="1">
                                        <label class="custom-control-label" for="statusSwitch">Approved
                                            (Status=1)</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="custom-control custom-switch">
                                        <input type="checkbox" class="custom-control-input" id="activeSwitch"
                                            name="active" value="1">
                                        <label class="custom-control-label" for="activeSwitch">Active Student</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Address Tab -->
                        <div class="tab-pane fade" id="address" role="tabpanel">
                            <div class="form-group">
                                <label>Mailing Address</label>
                                <textarea class="form-control" name="mailing_address" rows="2"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>City</label>
                                    <input type="text" class="form-control" name="city">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>State</label>
                                    <input type="text" class="form-control" name="state">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Zip Code</label>
                                    <input type="text" class="form-control" name="zip_code">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Country</label>
                                    <select class="form-control" name="country">
                                        <option value="">Select Country</option>
                                        {% for c in countries %}
                                        <option value="{{ c.id }}">{{ c.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Timezone</label>
                                    <input type="text" class="form-control" name="timezone" placeholder="UTC">
                                </div>
                            </div>
                        </div>

                        <!-- Academic Tab -->
                        <div class="tab-pane fade" id="academic" role="tabpanel">
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Course Applied</label>
                                    <select class="form-control" name="course_applied">
                                        <option value="">Select Course</option>
                                        {% for course in courses %}
                                        <option value="{{ course.id }}">{{ course.course_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Language</label>
                                    <select class="form-control" name="language">
                                        <option value="">Select Language</option>
                                        {% for lang in languages %}
                                        <option value="{{ lang.id }}">{{ lang.language_name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Highest Education</label>
                                    <input type="text" class="form-control" name="highest_education">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Starting Year</label>
                                    <input type="number" class="form-control" name="starting_year">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Ministry Status</label>
                                <input type="text" class="form-control" name="ministerial_status">
                            </div>
                            <div class="form-group">
                                <label>Church Affiliation</label>
                                <input type="text" class="form-control" name="church_affiliation">
                            </div>
                        </div>

                        <!-- Financial Tab -->
                        <div class="tab-pane fade" id="financial" role="tabpanel">
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Currently Employed?</label>
                                    <select class="form-control" name="currently_employed">
                                        <option value="">Select</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Scholarship Needed?</label>
                                    <select class="form-control" name="scholarship_needed">
                                        <option value="">Select</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label>Annual Income</label>
                                    <input type="text" class="form-control" name="income">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Affordable Amount</label>
                                    <input type="text" class="form-control" name="affordable_amount">
                                </div>
                            </div>
                        </div>

                        <!-- References Tab -->
                        <div class="tab-pane fade" id="references" role="tabpanel">
                            <h6>Reference 1</h6>
                            <div class="row">
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_name1" placeholder="Name"></div>
                                <div class="col-md-4"><input type="email" class="form-control mb-2"
                                        name="reference_email1" placeholder="Email"></div>
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_phone1" placeholder="Phone"></div>
                            </div>
                            <hr>
                            <h6>Reference 2</h6>
                            <div class="row">
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_name2" placeholder="Name"></div>
                                <div class="col-md-4"><input type="email" class="form-control mb-2"
                                        name="reference_email2" placeholder="Email"></div>
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_phone2" placeholder="Phone"></div>
                            </div>
                            <hr>
                            <h6>Reference 3</h6>
                            <div class="row">
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_name3" placeholder="Name"></div>
                                <div class="col-md-4"><input type="email" class="form-control mb-2"
                                        name="reference_email3" placeholder="Email"></div>
                                <div class="col-md-4"><input type="text" class="form-control mb-2"
                                        name="reference_phone3" placeholder="Phone"></div>
                            </div>
                        </div>

                    </div> <!-- End Tab Content -->

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Student</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- View Student Modal -->
<div class="modal fade" id="viewStudentModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Student Details</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" id="viewStudentContent">
                <!-- Content populated via JS -->
                <div class="text-center"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<!-- Bootstrap JS (for Tabs and Modals) - assuming base template loads it, but sometimes it doesn't -->
<!-- If admin/index.html loads bootstrap JS, we are good. -->

<style>
    .modal-backdrop {
        z-index: 1040 !important;
    }

    .modal {
        z-index: 1050 !important;
    }

    /* Force smaller buttons if btn-sm isn't enough */
    .btn-xs {
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        line-height: 1.5;
        border-radius: 0.2rem;
    }
</style>
<script>
    let studentTable;

    $(document).ready(function () {
        studentTable = $('#studentTable').DataTable({
            processing: true,
            serverSide: true,
            responsive: true,
            ajax: {
                url: '{% url "student_datatable" %}',
                type: 'GET',
                data: function (d) {
                    d.status = $('#statusFilter').val();
                    d.type = 'student'; // Only show students/applicants based on filter, passed consistently
                },
                error: function (xhr, error, code) {
                    console.error('DataTables Error:', error);
                }
            },
            columns: [
                {
                    data: null,
                    width: '30px',
                    searchable: false,
                    orderable: false,
                    render: function (data, type, row, meta) {
                        return meta.row + meta.settings._iDisplayStart + 1;
                    }
                },
                { data: 'preview', orderable: false, searchable: false, width: '60px' },
                { data: 'student_info', width: '250px' },
                { data: 'email', width: '200px' },
                { data: 'status', width: '100px' },
                { data: 'created_at', width: '120px' },
                { data: 'actions', orderable: false, searchable: false, width: '150px' }
            ],
            order: [[5, 'desc']], // Sort by Date Created by default
            pageLength: 12,
            language: {
                search: "Search Students:",
                lengthMenu: "Show _MENU_ records",
                info: "Showing _START_ to _END_ of _TOTAL_ students"
            }
        });
    });

    function filterTable() {
        studentTable.ajax.reload();
    }

    // Open Create Modal
    function openCreateModal() {
        $('#studentForm')[0].reset();
        $('#studentId').val(''); // Clear hidden ID
        $('#modalTitle').text('Add Student');

        // Reset Tabs to first one
        $('#studentTab a[href="#personal"]').tab('show');

        $('#studentModal').modal('show');
    }

    // Open Edit Modal
    window.editStudent = function (id) {
        // Fetch data
        $.ajax({
            url: '/menu/students/get/' + id + '/',
            type: 'GET',
            success: function (response) {
                if (response.success) {
                    const d = response.data;
                    $('#studentId').val(d.id);
                    $('#modalTitle').text('Edit Student: ' + d.first_name + ' ' + (d.last_name || ''));

                    // Populate Fields
                    $('input[name="first_name"]').val(d.first_name);
                    $('input[name="middle_name"]').val(d.middle_name);
                    $('input[name="last_name"]').val(d.last_name);
                    $('input[name="email"]').val(d.email);
                    $('input[name="student_id"]').val(d.student_id);
                    $('select[name="gender"]').val(d.gender);
                    $('input[name="date_of_birth"]').val(d.date_of_birth); // Expects YYYY-MM-DD
                    $('input[name="phone_number"]').val(d.phone_number);

                    $('select[name="mrital_status"]').val(d.mrital_status);
                    $('input[name="spouse_name"]').val(d.spouse_name);

                    // Status Checkboxes
                    $('#statusSwitch').prop('checked', d.status == 1);
                    $('#activeSwitch').prop('checked', d.active == 1);

                    // Address
                    $('textarea[name="mailing_address"]').val(d.mailing_address);
                    $('input[name="city"]').val(d.city);
                    $('input[name="state"]').val(d.state);
                    $('input[name="zip_code"]').val(d.zip_code);
                    $('select[name="country"]').val(d.country);
                    $('input[name="timezone"]').val(d.timezone);

                    // Academic
                    $('select[name="course_applied"]').val(d.course_applied);
                    $('select[name="language"]').val(d.language);
                    $('input[name="highest_education"]').val(d.highest_education);
                    $('input[name="starting_year"]').val(d.starting_year);
                    $('input[name="ministerial_status"]').val(d.ministerial_status);
                    $('input[name="church_affiliation"]').val(d.church_affiliation);

                    // Financial
                    $('select[name="currently_employed"]').val(d.currently_employed);
                    $('select[name="scholarship_needed"]').val(d.scholarship_needed);
                    $('input[name="income"]').val(d.income);
                    $('input[name="affordable_amount"]').val(d.affordable_amount);

                    // References
                    $('input[name="reference_name1"]').val(d.reference_name1);
                    $('input[name="reference_email1"]').val(d.reference_email1);
                    $('input[name="reference_phone1"]').val(d.reference_phone1);

                    $('input[name="reference_name2"]').val(d.reference_name2);
                    $('input[name="reference_email2"]').val(d.reference_email2);
                    $('input[name="reference_phone2"]').val(d.reference_phone2);

                    $('input[name="reference_name3"]').val(d.reference_name3);
                    $('input[name="reference_email3"]').val(d.reference_email3);
                    $('input[name="reference_phone3"]').val(d.reference_phone3);

                    // Reset Tabs
                    $('#studentTab a[href="#personal"]').tab('show');

                    $('#studentModal').modal('show');
                } else {
                    Swal.fire('Error', response.message, 'error');
                }
            },
            error: function () {
                Swal.fire('Error', 'Failed to fetch student data', 'error');
            }
        });
    }

    // Handle Form Submit
    window.handleFormSubmit = function (e) {
        e.preventDefault();
        const studentId = $('#studentId').val();
        const url = studentId ?
            '/menu/students/update/' + studentId + '/' :
            '{% url "student_create" %}';

        const formData = new FormData(document.getElementById('studentForm'));

        // Manually handle checkbox values for unchecked state if needed
        // But Django handles generic POST. If checkbox not checked, it's missing.
        // The view looks for `data.get('status', '0') == '1'`.
        // If unchecked, it returns '0', which == '1' is False. Correct.

        $.ajax({
            url: url,
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function (response) {
                if (response.success) {
                    $('#studentModal').modal('hide');
                    studentTable.ajax.reload();
                    Swal.fire({
                        icon: 'success',
                        title: 'Success',
                        text: response.message,
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Error', response.message, 'error');
                }
            },
            error: function (xhr) {
                Swal.fire('Error', 'An error occurred: ' + xhr.responseText, 'error');
            }
        });
    }

    // Toggle Active Status
    window.toggleActive = function (id, currentStatus) {
        const action = currentStatus ? 'deactivate' : 'activate';
        Swal.fire({
            title: `Confirm ${action}?`,
            text: `Are you sure you want to ${action} this student?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes'
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: '/menu/students/toggle-active/' + id + '/',
                    type: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    success: function (response) {
                        if (response.success) {
                            studentTable.ajax.reload();
                            Swal.fire('Success', response.message, 'success');
                        } else {
                            Swal.fire('Error', response.message, 'error');
                        }
                    },
                    error: function () {
                        Swal.fire('Error', 'Failed to toggle status', 'error');
                    }
                });
            }
        });
    }

    // Toggle Approval
    window.toggleApproval = function (id, currentStatus) {
        const action = currentStatus ? 'disapprove' : 'approve';
        Swal.fire({
            title: `Confirm ${action}?`,
            text: `Are you sure you want to ${action} this student?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes'
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: '/menu/students/toggle-approval/' + id + '/',
                    type: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    success: function (response) {
                        if (response.success) {
                            studentTable.ajax.reload();
                            Swal.fire('Success', response.message, 'success');
                        } else {
                            Swal.fire('Error', response.message, 'error');
                        }
                    },
                    error: function () {
                        Swal.fire('Error', 'Failed to toggle approval', 'error');
                    }
                });
            }
        });
    }

    // Delete Student
    window.deleteStudent = function (id) {
        Swal.fire({
            title: 'Are you sure?',
            text: "You won't be able to revert this!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: '/menu/admin/students/delete/' + id + '/',
                    type: 'POST', // or DELETE/GET depending on legacy implementation?
                    // Legacy `student_delete` view usually expects POST or GET.
                    // Let's check: view says `def student_delete`. usually accessible via url.
                    // But if it's protected by `@require_http_methods`, we need to be careful.
                    // Outline didn't show decorators.
                    // Assuming POST for safety with CSRF.
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    success: function (response) {
                        if (response.success) {
                            studentTable.ajax.reload();
                            Swal.fire('Deleted!', response.message, 'success');
                        } else {
                            Swal.fire('Error', response.message, 'error');
                        }
                    },
                    error: function () {
                        // Fallback try GET if POST fails (legacy support)
                        // Actually, I should stick to one. I'll use POST.
                        Swal.fire('Error', 'Failed to delete student', 'error');
                    }
                });
            }
        });
    }

    // View Student (Read Only)
    window.viewStudent = function (id) {
        $('#viewStudentContent').html('<div class="text-center"><i class="fas fa-spinner fa-spin"></i> Loading...</div>');
        $('#viewStudentModal').modal('show');

        $.ajax({
            url: '/menu/students/get/' + id + '/',
            type: 'GET',
            success: function (response) {
                if (response.success) {
                    const d = response.data;
                    let html = `
                        <table class="table table-bordered">
                            <tbody>
                                <tr><th>Full Name</th><td>${d.first_name} ${d.middle_name || ''} ${d.last_name || ''}</td></tr>
                                <tr><th>Email</th><td>${d.email}</td></tr>
                                <tr><th>Student ID</th><td>${d.student_id || '-'}</td></tr>
                                <tr><th>Phone</th><td>${d.phone_number || '-'}</td></tr>
                                <tr><th>DOB</th><td>${d.date_of_birth || '-'}</td></tr>
                                <tr><th>Gender</th><td>${d.gender || '-'}</td></tr>
                                <tr><th>Marital Status</th><td>${d.mrital_status || '-'}</td></tr>
                                <tr><th>Address</th><td>${d.mailing_address || ''}<br>${d.city}, ${d.state} ${d.zip_code}<br>${d.country_name || ''}</td></tr>
                                <tr><th>Course Applied</th><td>${d.course_applied_name || '-'}</td></tr>
                                <tr><th>Language</th><td>${d.language_name || '-'}</td></tr>
                                <tr><th>Status</th><td>${d.status == 1 ? '<span class="badge badge-success">Approved</span>' : '<span class="badge badge-warning">Pending</span>'}</td></tr>
                                <tr><th>Active</th><td>${d.active == 1 ? '<span class="badge badge-success">Yes</span>' : '<span class="badge badge-secondary">No</span>'}</td></tr>
                            </tbody>
                        </table>
                    `;
                    $('#viewStudentContent').html(html);
                } else {
                    $('#viewStudentContent').html('<div class="alert alert-danger">Failed to load data</div>');
                }
            },
            error: function () {
                $('#viewStudentContent').html('<div class="alert alert-danger">Error fetching data</div>');
            }
        });
    }

</script>
{% endblock %}
