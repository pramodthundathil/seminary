{% extends 'admin/index.html' %}
{% block content %}

<div class="gallery-container">
    <div class="page-header">
        <h1>Edit User</h1>
        <a href="{% url 'users_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <div class="form-container" style="background:white;padding:30px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <form method="post">
            {% csrf_token %}
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Name <span style="color:red;">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user_edit.name }}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="username" class="form-label">Username <span style="color:red;">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user_edit.username }}" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email <span style="color:red;">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user_edit.email }}" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password <span style="font-size:12px;color:gray;">(Leave blank to keep current)</span></label>
                        <input type="password" class="form-control" id="password" name="password">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="role" class="form-label">Role <span style="color:red;">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Select Role</option>
                            {% for role in roles %}
                                <option value="{{ role.id }}" {% if role.id == current_role_id %}selected{% endif %}>{{ role.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="is_active" class="form-label">Status <span style="color:red;">*</span></label>
                        <select class="form-select" id="is_active" name="is_active" required>
                            <option value="true" {% if user_edit.is_active %}selected{% endif %}>Active</option>
                            <option value="false" {% if not user_edit.is_active %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions" style="margin-top:30px;padding-top:20px;border-top:1px solid var(--gray-200);">
                <button type="submit" class="btn btn-primary" style="min-width:120px;">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="{% url 'users_list' %}" class="btn btn-secondary" style="min-width:120px;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
