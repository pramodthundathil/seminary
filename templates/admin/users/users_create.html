{% extends 'admin/index.html' %}
{% block content %}

<div class="gallery-container">
    <div class="page-header">
        <h1>Create User</h1>
        <a href="{% url 'users_list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <div class="form-container" style="background:white;padding:30px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <form method="post">
            {% csrf_token %}
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Name <span style="color:red;">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="username" class="form-label">Username <span style="color:red;">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email <span style="color:red;">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Password <span style="color:red;">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
            </div>

            <div class="form-group mb-3">
                <label for="role" class="form-label">Role <span style="color:red;">*</span></label>
                <select class="form-select" id="role" name="role" required>
                    <option value="">Select Role</option>
                    {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions" style="margin-top:30px;padding-top:20px;border-top:1px solid var(--gray-200);">
                <button type="submit" class="btn btn-primary" style="min-width:120px;">
                    <i class="fas fa-save"></i> Create User
                </button>
                <a href="{% url 'users_list' %}" class="btn btn-secondary" style="min-width:120px;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
